<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osstivia by OssiaLabs - Precision Bone Modulation</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #f5a623;
  --accent:  #f97316;
  --bg:      #09090b;
  --card:    #111114;
  --card2:   #16161a;
  --border:  rgba(255,255,255,0.07);
  --muted:   rgba(255,255,255,0.48);
  --fg:      #f5f5f5;
  --gold:    #f5a623;
  --amber:   #f97316;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: #09090b !important; background-color: #09090b !important; color: var(--fg); font-family: 'Space Grotesk', sans-serif; overflow-x: hidden; }
.mono { font-family: 'Space Mono', monospace; }

/* Animations */
@keyframes fadeUp   { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
@keyframes pulse-gold { 0%,100% { box-shadow: 0 0 0 0 rgba(245,166,35,0.4); } 50% { box-shadow: 0 0 0 12px rgba(245,166,35,0); } }
@keyframes gradMove { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
